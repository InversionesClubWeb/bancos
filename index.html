<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis cuentas regresivas</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:380px;
}

.card{
    background:#1e293b;
    color:#fff;
    padding:18px 20px;
    margin:12px 0;
    border-radius:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 5px 12px rgba(0,0,0,.35);
}

.nombre{
    font-size:20px;
    font-weight:bold;
}

.dias{
    font-size:28px;
    font-weight:bold;
    color:#38bdf8;
}
</style>
</head>
<body>

<div class="container">

    <div class="card">
        <div class="nombre">🏦 Scotiabank</div>
        <div class="dias">61 días</div>
    </div>

    <div class="card">
        <div class="nombre">🏦 BBVA</div>
        <div class="dias">61 días</div>
    </div>

    <div class="card">
        <div class="nombre">📶 Claro</div>
        <div class="dias">90 días</div>
    </div>

    <div class="card">
        <div class="nombre">📱 Bitel</div>
        <div class="dias">34 días</div>
    </div>

</div>

</body>
</html>
